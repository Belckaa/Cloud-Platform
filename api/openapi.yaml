openapi: 3.0.3
info:
  title: E-Commerce Cloud Platform API
  version: 1.0.0
  description: REST API поточної реалізації модуля створення замовлень.
servers:
  - url: http://localhost:8081
    description: Локальний Docker deployment (host port 8081 -> container port 8080)
tags:
  - name: Orders
    description: Операції зі створення замовлень
paths:
  /orders:
    post:
      security: []
      tags:
        - Orders
      summary: Створити замовлення
      operationId: createOrder
      description: Створює замовлення після перевірки доступності товарів.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: 11111111-1111-4111-8111-111111111111
              items:
                - productId: 22222222-2222-4222-8222-222222222222
                  quantity: 2
                  unitPrice: 49.90
              shippingAddress:
                country: Latvia
                city: Riga
                street: Brivibas iela
                building: "10"
                postalCode: LV-1010
      responses:
        '400':
          description: Некоректний формат або вміст запиту.
        '201':
          description: Замовлення успішно створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                id: 046d5fc9-6928-426d-8b63-27872907a27a
                customerId: 11111111-1111-4111-8111-111111111111
                status: PENDING
                totalAmount: 99.80
                createdAt: '2026-11-25T18:34:14.325641811Z'
components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
        - shippingAddress
      properties:
        customerId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        shippingAddress:
          $ref: '#/components/schemas/Address'
    OrderItemRequest:
      type: object
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
    Address:
      type: object
      required:
        - country
        - city
        - street
        - building
        - postalCode
      properties:
        country:
          type: string
        city:
          type: string
        street:
          type: string
        building:
          type: string
        postalCode:
          type: string
    CreateOrderResponse:
      type: object
      required:
        - id
        - customerId
        - status
        - totalAmount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          type: string
          example: PENDING
        totalAmount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
